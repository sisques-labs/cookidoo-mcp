name: Trunk CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  # Only exercised when scan_image: true below, but GitHub validates every
  # caller's granted permissions against the called reusable workflow's
  # top-level declaration statically — required unconditionally, same trap
  # documented for docker-release.yml after it broke a consumer's
  # release.yml for real.
  security-events: write

jobs:
  pipeline:
    uses: sisques-labs/workflows/.github/workflows/trunk-ci-cd.yml@main
    with:
      image_name: sisqueslabs/cookidoo-mcp
      ghcr_image_name: ghcr.io/sisques-labs/cookidoo-mcp
      push_ghcr: true
      node_version: "22"
      run_lint: true
      run_test: true
      platforms: linux/amd64,linux/arm64
      scan_image: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      security-events: write
